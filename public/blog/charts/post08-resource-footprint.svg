  <rect width="1280" height="720" fill="#f4f1ea"/>
  <text x="64" y="80" class="title">The hot path is three containers; the rest idle</text>
  <text x="64" y="108" class="mono sub">per-container CPU and memory under a steady 100-VU ingest load &#183; CPU% via docker stats (multi-core, can exceed 100)</text><line x1="864" y1="131" x2="886" y2="131" stroke="#0BA06B" stroke-width="2.6" /><text x="892" y="135" class="mono leg">ingest hot path</text><line x1="1009" y1="131" x2="1031" y2="131" stroke="#9a9089" stroke-width="2.6" /><text x="1037" y="135" class="mono leg">idle / event-driven</text><rect x="96" y="178" width="1088" height="432" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><text x="1100" y="198" text-anchor="end" class="mono axtitle">memory</text><line x1="360.0" y1="200" x2="360.0" y2="514" stroke="#16131019"/><text x="360.0" y="530" text-anchor="middle" class="mono ax">0</text><line x1="498.5" y1="200" x2="498.5" y2="514" stroke="#16131019"/><text x="498.5" y="530" text-anchor="middle" class="mono ax">50</text><line x1="636.9" y1="200" x2="636.9" y2="514" stroke="#16131019"/><text x="636.9" y="530" text-anchor="middle" class="mono ax">100</text><line x1="775.4" y1="200" x2="775.4" y2="514" stroke="#16131019"/><text x="775.4" y="530" text-anchor="middle" class="mono ax">150</text><line x1="913.8" y1="200" x2="913.8" y2="514" stroke="#16131019"/><text x="913.8" y="530" text-anchor="middle" class="mono ax">200</text><line x1="1052.3" y1="200" x2="1052.3" y2="514" stroke="#16131019"/><text x="1052.3" y="530" text-anchor="middle" class="mono ax">250</text><text x="344" y="225" text-anchor="end" class="mono lbl" font-size="13">ingestion-gateway</text><rect x="360" y="210" width="625.8" height="19" rx="3.5" fill="#0BA06B" fill-opacity="0.9"/><text x="993.8" y="225" class="mono ax" fill="#161310">226%</text><text x="1100" y="225" text-anchor="end" class="mono ax">509 MiB</text><text x="344" y="256" text-anchor="end" class="mono lbl" font-size="13">clickhouse</text><rect x="360" y="241" width="168.9" height="19" rx="3.5" fill="#0BA06B" fill-opacity="0.9"/><text x="536.9" y="256" class="mono ax" fill="#161310">61% <tspan fill="#fb2c36">&#183; peak 250%</tspan></text><text x="1100" y="256" text-anchor="end" class="mono ax">962 MiB</text><text x="344" y="287" text-anchor="end" class="mono lbl" font-size="13">redpanda</text><rect x="360" y="272" width="166.2" height="19" rx="3.5" fill="#0BA06B" fill-opacity="0.9"/><text x="534.2" y="287" class="mono ax" fill="#161310">60% <tspan fill="#fb2c36">&#183; peak 69%</tspan></text><text x="1100" y="287" text-anchor="end" class="mono ax">1.79 GiB</text><text x="344" y="318" text-anchor="end" class="mono lbl" font-size="13">normalization</text><rect x="360" y="303" width="102.5" height="19" rx="3.5" fill="#0BA06B" fill-opacity="0.9"/><text x="470.5" y="318" class="mono ax" fill="#161310">37% <tspan fill="#fb2c36">&#183; peak 57%</tspan></text><text x="1100" y="318" text-anchor="end" class="mono ax">306 MiB</text><text x="344" y="349" text-anchor="end" class="mono lbl" font-size="13">clustering</text><rect x="360" y="334" width="33.2" height="19" rx="3.5" fill="#0BA06B" fill-opacity="0.9"/><text x="401.2" y="349" class="mono ax" fill="#161310">12%</text><text x="1100" y="349" text-anchor="end" class="mono ax">113 MiB</text><text x="344" y="380" text-anchor="end" class="mono lbl" font-size="13">ai-service</text><text x="368.0" y="380" class="mono ax" fill="#161310">idle</text><text x="1100" y="380" text-anchor="end" class="mono ax">141 MiB</text><text x="344" y="411" text-anchor="end" class="mono lbl" font-size="13">auth-service</text><text x="368.0" y="411" class="mono ax" fill="#161310">idle</text><text x="1100" y="411" text-anchor="end" class="mono ax">118 MiB</text><text x="344" y="442" text-anchor="end" class="mono lbl" font-size="13">incident-service</text><text x="368.0" y="442" class="mono ax" fill="#161310">idle</text><text x="1100" y="442" text-anchor="end" class="mono ax">240 MiB</text><text x="344" y="473" text-anchor="end" class="mono lbl" font-size="13">notification</text><text x="368.0" y="473" class="mono ax" fill="#161310">idle</text><text x="1100" y="473" text-anchor="end" class="mono ax">151 MiB</text><text x="344" y="504" text-anchor="end" class="mono lbl" font-size="13">postgres</text><text x="368.0" y="504" class="mono ax" fill="#161310">idle <tspan fill="#fb2c36">&#183; peak 12%</tspan></text><text x="1100" y="504" text-anchor="end" class="mono ax">67 MiB</text><text x="720" y="554" text-anchor="middle" class="mono axtitle">CPU % (median over load window)</text>
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#16131019"/>
  <text x="64" y="690" class="mono foot">single laptop &#183; docker desktop &#183; 512MB/svc &#183; redpanda 1-node &#183; clickhouse 24.3 &#183; k6 100 VUs</text>
  
