  <text x="64" y="80" class="title">Investigate with AI (planned): LangGraph agent workflow</text>
  <text x="64" y="108" class="mono sub">When one LLM call is not enough &#183; parallel gather, verify loop, human review gate, Postgres checkpoint &#183; planned</text><line x1="779" y1="131" x2="801" y2="131" stroke="#161310" stroke-width="2.6" /><text x="807" y="135" class="mono leg">deterministic node</text><line x1="946" y1="131" x2="968" y2="131" stroke="#a684ff" stroke-width="2.6" /><text x="974" y="135" class="mono leg">LLM node</text><line x1="1039" y1="131" x2="1061" y2="131" stroke="#0BA06B" stroke-width="2.6" /><text x="1067" y="135" class="mono leg">human / persist</text><rect x="56" y="150" width="1160" height="478" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><rect x="520" y="178" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.5"/><text x="600" y="200" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#161310">load_context</text><text x="600" y="216" text-anchor="middle" class="mono ax" font-size="10">incident + logs + repo pin</text><line x1="600" y1="222" x2="600" y2="240" stroke="#161310" stroke-width="1.8"/><path d="M600 248 L595 238 L605 238 Z" fill="#161310"/><rect x="520" y="248" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="600" y="270" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">triage</text><text x="600" y="286" text-anchor="middle" class="mono ax" font-size="10">structured, fast model</text><line x1="600" y1="292" x2="600" y2="310" stroke="#161310" stroke-width="1.8"/><path d="M600 318 L595 308 L605 308 Z" fill="#161310"/><text x="90" y="312" class="mono ax" font-size="11">conditional fan-out (Send)</text><rect x="90" y="318" width="148" height="52" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.5"/><text x="164" y="340" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#161310">gather_logs</text><text x="164" y="356" text-anchor="middle" class="mono ax" font-size="10">ClickHouse samples</text><rect x="268" y="318" width="148" height="52" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.5"/><text x="342" y="340" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#161310">gather_history</text><text x="342" y="356" text-anchor="middle" class="mono ax" font-size="10">incidents + memory</text><rect x="446" y="318" width="168" height="52" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="530" y="340" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">code_investigator</text><text x="530" y="356" text-anchor="middle" class="mono ax" font-size="10">subgraph + tools</text><rect x="644" y="318" width="148" height="52" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.5"/><text x="718" y="340" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#161310">search_runbooks</text><text x="718" y="356" text-anchor="middle" class="mono ax" font-size="10">RAG + CRAG grade</text><line x1="164" y1="318" x2="600" y2="292" stroke="#9a9089" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="342" y1="318" x2="600" y2="292" stroke="#9a9089" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="530" y1="318" x2="600" y2="292" stroke="#9a9089" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="718" y1="318" x2="600" y2="292" stroke="#9a9089" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="600" y1="370" x2="600" y2="400" stroke="#161310" stroke-width="1.8"/><path d="M600 408 L595 398 L605 398 Z" fill="#161310"/><rect x="520" y="408" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="600" y="430" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">synthesize</text><text x="600" y="446" text-anchor="middle" class="mono ax" font-size="10">hypotheses + evidence ids</text><line x1="600" y1="452" x2="600" y2="480" stroke="#161310" stroke-width="1.8"/><path d="M600 488 L595 478 L605 478 Z" fill="#161310"/><rect x="520" y="488" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="600" y="510" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">verify</text><text x="600" y="526" text-anchor="middle" class="mono ax" font-size="10">supported / refuted / open</text><path d="M520 510 C 420 510, 420 430, 520 430" fill="none" stroke="#9a9089" stroke-width="1.4" stroke-dasharray="5 4"/><text x="400" y="470" class="mono ax" font-size="10">targeted re-gather (bounded)</text><line x1="600" y1="532" x2="600" y2="560" stroke="#161310" stroke-width="1.8"/><path d="M600 568 L595 558 L605 558 Z" fill="#161310"/><rect x="520" y="568" width="160" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="600" y="590" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">root_cause</text><text x="600" y="606" text-anchor="middle" class="mono ax" font-size="10">grounding check</text><rect x="820" y="408" width="150" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#0BA06B" stroke-width="1.5"/><text x="895" y="430" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#0BA06B">human_review</text><text x="895" y="446" text-anchor="middle" class="mono ax" font-size="10">interrupt()</text><rect x="820" y="488" width="150" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.5"/><text x="895" y="510" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">propose_changes</text><text x="895" y="526" text-anchor="middle" class="mono ax" font-size="10">patch suggestions</text><rect x="820" y="568" width="150" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.5"/><text x="895" y="590" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#161310">validate_changes</text><text x="895" y="606" text-anchor="middle" class="mono ax" font-size="10">deterministic retry</text><rect x="1020" y="568" width="130" height="44" rx="8" fill="#ffffff" fill-opacity="0.55" stroke="#0BA06B" stroke-width="1.5"/><text x="1085" y="590" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#0BA06B">finalize</text><text x="1085" y="606" text-anchor="middle" class="mono ax" font-size="10">persist + SSE events</text><line x1="680" y1="590" x2="820" y2="430" stroke="#0BA06B" stroke-width="1.6"/><text x="730" y="520" class="mono ax" font-size="10" fill="#0BA06B">approve</text><line x1="895" y1="452" x2="895" y2="480" stroke="#161310" stroke-width="1.8"/><path d="M895 488 L890 478 L900 478 Z" fill="#161310"/><line x1="895" y1="532" x2="895" y2="560" stroke="#161310" stroke-width="1.8"/><path d="M895 568 L890 558 L900 558 Z" fill="#161310"/><line x1="970" y1="590" x2="1011" y2="590" stroke="#161310" stroke-width="1.8"/><path d="M1020 590 L1010 585 L1010 595 Z" fill="#161310"/>
