  <text x="64" y="108" class="mono sub">FastAPI returns 202 before the model runs &#183; prompt &#8594; structured Pydantic output &#8594; legacy plain text &#8594; PATCH</text><rect x="56" y="150" width="1160" height="462" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><text x="90" y="198" class="mono ax" font-size="12">incident side unchanged from post 11: @Async POST, incident already committed with ai_summary = null</text><rect x="86" y="219" width="200" height="58" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#0BA06B" stroke-width="1.6"/><text x="186" y="245" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#0BA06B">incident-service</text><text x="186" y="263" text-anchor="middle" class="mono ax" font-size="11">@Async POST /summaries</text><line x1="286" y1="248" x2="331" y2="248" stroke="#161310" stroke-width="2"/><path d="M340 248 L329 242 L329 254 Z" fill="#161310"/><rect x="340" y="219" width="260" height="58" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.6"/><text x="470" y="245" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">ai-service (FastAPI)</text><text x="470" y="263" text-anchor="middle" class="mono ax" font-size="11">BackgroundTasks + 202</text><line x1="600" y1="248" x2="651" y2="248" stroke="#0BA06B" stroke-width="2"/><path d="M660 248 L649 242 L649 254 Z" fill="#0BA06B"/><text x="730" y="250" text-anchor="middle" class="mono ax" font-size="11" fill="#0BA06B">returns immediately</text><line x1="90" y1="322" x2="1182" y2="322" stroke="#9a9089" stroke-width="1.4" stroke-dasharray="6 5"/><text x="90" y="313" class="mono ax" font-size="12"><tspan font-weight="600">background task</tspan> &#183; errors logged, never propagated (same contract as Java AiSummaryService)</text><line x1="470" y1="277" x2="470" y2="355" stroke="#161310" stroke-width="2"/><path d="M470 364 L464 353 L476 353 Z" fill="#161310"/><rect x="88" y="368" width="200" height="64" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#9a9089" stroke-width="1.6"/><text x="188" y="397" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">format context</text><text x="188" y="415" text-anchor="middle" class="mono ax" font-size="11">SummaryRequest &#8594; text</text><line x1="288" y1="400" x2="339" y2="400" stroke="#161310" stroke-width="2"/><path d="M348 400 L337 394 L337 406 Z" fill="#161310"/><rect x="348" y="368" width="280" height="64" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.6"/><text x="488" y="397" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#a684ff">ChatPromptTemplate</text><text x="488" y="415" text-anchor="middle" class="mono ax" font-size="11">system + incident body</text><line x1="628" y1="400" x2="679" y2="400" stroke="#a684ff" stroke-width="2"/><path d="M688 400 L677 394 L677 406 Z" fill="#a684ff"/><text x="658" y="389" text-anchor="middle" class="mono ax" font-size="11" fill="#a684ff">|</text><rect x="688" y="368" width="300" height="64" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#a684ff" stroke-width="1.6"/><text x="838" y="397" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#a684ff">with_structured_output</text><text x="838" y="415" text-anchor="middle" class="mono ax" font-size="11">IncidentSummary (Pydantic)</text><line x1="988" y1="400" x2="1039" y2="400" stroke="#a684ff" stroke-width="2"/><path d="M1048 400 L1037 394 L1037 406 Z" fill="#a684ff"/><rect x="1048" y="368" width="150" height="64" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#161310" stroke-width="1.6"/><text x="1123" y="397" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">legacy text</text><text x="1123" y="415" text-anchor="middle" class="mono ax" font-size="11">console format</text><line x1="1123" y1="432" x2="1123" y2="487" stroke="#0BA06B" stroke-width="2"/><path d="M1123 496 L1117 485 L1129 485 Z" fill="#0BA06B"/><rect x="898" y="496" width="260" height="64" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#0BA06B" stroke-width="1.6"/><text x="1028" y="525" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#0BA06B">PATCH /ai-summary</text><text x="1028" y="543" text-anchor="middle" class="mono ax" font-size="11">incident-service callback</text><text x="90" y="586" class="mono ax" font-size="12">LLM resolved per purpose: <tspan font-weight="600">LLM_SUMMARY=provider:model</tspan> &#183; LangSmith via configure_tracing() at startup (settings mirrored to os.environ)</text>
