  <text x="64" y="108" class="mono sub">normalization throws on bad payloads; the consumer routes them to raw-logs-dlq and acks anyway, instead of dropping or blocking</text><rect x="96" y="190" width="1088" height="392" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><rect x="150" y="276" width="196" height="84" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#16131019" stroke-width="1.4"/><text x="168" y="308" class="lbl" font-size="15">ingestion-gateway</text><text x="168" y="330" class="mono ax">600 x 202, 0 errors</text><rect x="452" y="276" width="212" height="84" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#16131019" stroke-width="1.4"/><text x="470" y="308" class="lbl" font-size="15">normalization</text><text x="470" y="330" class="mono ax">parse + fingerprint</text><rect x="962" y="276" width="222" height="84" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#0BA06B" stroke-width="1.4"/><text x="980" y="308" class="lbl" font-size="15">incident created</text><text x="980" y="330" class="mono ax">clean path intact</text><text x="1166" y="326" text-anchor="end" class="mono" font-size="34" font-weight="600" fill="#0BA06B">1</text><rect x="558" y="452" width="232" height="84" rx="9" fill="#ffffff" fill-opacity="0.55" stroke="#fb2c36" stroke-width="1.4"/><text x="576" y="484" class="lbl" font-size="15">raw-logs-dlq</text><text x="576" y="506" class="mono ax">dead-letter topic</text><text x="772" y="502" text-anchor="end" class="mono" font-size="34" font-weight="600" fill="#fb2c36">300</text><text x="150" y="258" class="mono ax">600 logs sent &#183; 300 poison + 300 clean</text><line x1="346" y1="318" x2="443" y2="318" stroke="#161310" stroke-width="2.2"/><path d="M452 318 L441 312 L441 324 Z" fill="#161310"/><text x="399" y="306" text-anchor="middle" class="mono ax" fill="#9a9089">600 accepted</text><line x1="664" y1="318" x2="953" y2="318" stroke="#0BA06B" stroke-width="2.2"/><path d="M962 318 L951 312 L951 324 Z" fill="#0BA06B"/><text x="813" y="306" text-anchor="middle" class="mono ax" fill="#0BA06B">300 clean &#183; clustering threshold 10</text><path d="M558 360 L558 428 L674 428 L674 443" fill="none" stroke="#fb2c36" stroke-width="2.2"/><path d="M674 452 L668 441 L680 441 Z" fill="#fb2c36"/><text x="572" y="382" class="mono ax" fill="#fb2c36">300 poison</text><text x="160" y="566" class="mono ax" font-size="13"><tspan fill="#0BA06B" font-weight="600">0</tspan> messages dropped &#183; <tspan fill="#0BA06B" font-weight="600">0</tspan> non-202 responses &#183; consumer never blocks on a bad payload</text>
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#16131019"/>
