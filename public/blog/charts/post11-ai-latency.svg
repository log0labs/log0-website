  <rect width="1280" height="720" fill="#f4f1ea"/>
  <text x="64" y="80" class="title">A 202 is not a generation</text>
  <text x="64" y="108" class="mono sub">ai-service returns 202 after the synchronous LLM call &#183; groq llama-3.3-70b free tier, n=20 &#183; 1 real generation, 19 throttled</text><line x1="887" y1="131" x2="909" y2="131" stroke="#0BA06B" stroke-width="2.6" /><text x="915" y="135" class="mono leg">real generation</text><line x1="1032" y1="131" x2="1054" y2="131" stroke="#a684ff" stroke-width="2.6" /><text x="1060" y="135" class="mono leg">rate-limited 202</text><rect x="96" y="188" width="1088" height="404" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><line x1="170" y1="506.6" x2="1110" y2="506.6" stroke="#16131019"/><line x1="170" y1="461.3" x2="1110" y2="461.3" stroke="#16131019"/><line x1="170" y1="356.0" x2="1110" y2="356.0" stroke="#16131019"/><line x1="170" y1="310.7" x2="1110" y2="310.7" stroke="#16131019"/><line x1="170" y1="265.3" x2="1110" y2="265.3" stroke="#16131019"/><text x="156" y="510.6" text-anchor="end" class="mono ax">50ms</text><text x="156" y="465.3" text-anchor="end" class="mono ax">100ms</text><text x="156" y="360.0" text-anchor="end" class="mono ax">500ms</text><text x="156" y="314.7" text-anchor="end" class="mono ax">1s</text><text x="156" y="269.3" text-anchor="end" class="mono ax">2s</text><line x1="170" y1="370.6" x2="1110" y2="370.6" stroke="#9a9089" stroke-width="1.4" stroke-dasharray="5 5"/><text x="1110" y="362.6" text-anchor="end" class="mono ax">generation threshold</text><circle cx="193.5" cy="260.4" r="7" fill="#0BA06B" fill-opacity="0.95"/><text x="209.5" y="265.4" class="anno" fill="#0BA06B">real generation &#183; 2156ms</text><circle cx="240.5" cy="509.3" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="287.5" cy="513.5" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="334.5" cy="469.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="381.5" cy="510.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="428.5" cy="501.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="475.5" cy="484.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="522.5" cy="515.0" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="569.5" cy="443.1" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="616.5" cy="506.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="663.5" cy="444.1" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="710.5" cy="482.7" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="757.5" cy="515.0" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="804.5" cy="490.4" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="851.5" cy="507.9" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="898.5" cy="478.4" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="945.5" cy="464.6" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="992.5" cy="490.4" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="1039.5" cy="456.8" r="5" fill="#a684ff" fill-opacity="0.7"/><circle cx="1086.5" cy="474.2" r="5" fill="#a684ff" fill-opacity="0.7"/><text x="180" y="524.4" class="mono ax" fill="#a684ff">19/20 rate-limited &#183; 202 in ~64ms, no LLM call</text><text transform="translate(120,380) rotate(-90)" text-anchor="middle" class="mono axtitle">round-trip latency (log scale)</text><text x="640" y="570" text-anchor="middle" class="mono axtitle">request index (1 - 20)</text>
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#16131019"/>
