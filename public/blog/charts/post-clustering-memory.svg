    <g fill="#0BA06B"><circle cx="5" cy="7" r="1.5" opacity="0.45"/><circle cx="5" cy="16" r="1.5" opacity="0.45"/><circle cx="5" cy="25" r="1.5" opacity="0.45"/><circle cx="11" cy="7" r="1.6" opacity="0.7"/><circle cx="11" cy="16" r="1.6" opacity="0.7"/><circle cx="11" cy="25" r="1.6" opacity="0.7"/><circle cx="16" cy="7" r="1.7"/><circle cx="16" cy="16" r="1.7"/><circle cx="16" cy="25" r="1.7"/></g>
    <circle cx="26" cy="16" r="6" fill="#0BA06B" opacity="0.18"/><circle cx="26" cy="16" r="3.6" fill="#0BA06B"/>
  </g>
  <text x="1173" y="696" text-anchor="start" class="mono" font-size="18" font-weight="500" fill="#161310">log0</text>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/></svg>