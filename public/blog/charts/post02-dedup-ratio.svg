      .annom{font-weight:400;font-size:12px;fill:#9a9089}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f4f1ea"/>
  <text x="64" y="80" class="title">One incident per fingerprint, at any volume</text>
  <text x="64" y="108" class="mono sub">logs ingested per incident created, by number of distinct error templates &#183; constant 50 VUs</text><line x1="980" y1="131" x2="1002" y2="131" stroke="#0BA06B" stroke-width="2.6" /><text x="1008" y="135" class="mono leg">dedup ratio (log scale)</text><rect x="96" y="168" width="1088" height="424" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><line x1="200" y1="545.0" x2="1100" y2="545.0" stroke="#16131019"/><line x1="200" y1="443.5" x2="1100" y2="443.5" stroke="#16131019"/><line x1="200" y1="342.0" x2="1100" y2="342.0" stroke="#16131019"/><line x1="200" y1="240.5" x2="1100" y2="240.5" stroke="#16131019"/><text x="186" y="549.0" text-anchor="end" class="mono ax">100</text><text x="186" y="447.5" text-anchor="end" class="mono ax">1k</text><text x="186" y="346.0" text-anchor="end" class="mono ax">10k</text><text x="186" y="244.5" text-anchor="end" class="mono ax">100k</text><text transform="translate(150,377.5) rotate(-90)" text-anchor="middle" class="mono axtitle">logs : incidents (log scale)</text><text x="650" y="625" text-anchor="middle" class="mono ax">distinct templates emitted</text><rect x="303.2" y="234.2" width="96" height="310.8" rx="4" fill="#0BA06B" fill-opacity="0.92"/><text x="351.2" y="208.2" text-anchor="middle" class="mono lbl" font-size="15">115,489:1</text><text x="351.2" y="225.2" text-anchor="middle" class="mono ax">115,489 logs</text><text x="351.2" y="567.0" text-anchor="middle" class="mono ax">1</text><text x="351.2" y="585.0" text-anchor="middle" class="mono ax" fill="#9a9089">1 incident</text><rect x="502.4" y="347.9" width="96" height="197.1" rx="4" fill="#0BA06B" fill-opacity="0.92"/><text x="550.4" y="321.9" text-anchor="middle" class="mono lbl" font-size="15">8,760:1</text><text x="550.4" y="338.9" text-anchor="middle" class="mono ax">87,604 logs</text><text x="550.4" y="567.0" text-anchor="middle" class="mono ax">10</text><text x="550.4" y="585.0" text-anchor="middle" class="mono ax" fill="#9a9089">10 incidents</text><rect x="701.6" y="416.2" width="96" height="128.8" rx="4" fill="#0BA06B" fill-opacity="0.92"/><text x="749.6" y="390.2" text-anchor="middle" class="mono lbl" font-size="15">1,860:1</text><text x="749.6" y="407.2" text-anchor="middle" class="mono ax">93,000 logs</text><text x="749.6" y="567.0" text-anchor="middle" class="mono ax">50</text><text x="749.6" y="585.0" text-anchor="middle" class="mono ax" fill="#9a9089">50 incidents</text><rect x="900.8" y="445.0" width="96" height="100.0" rx="4" fill="#0BA06B" fill-opacity="0.92"/><text x="948.8" y="419.0" text-anchor="middle" class="mono lbl" font-size="15">967:1</text><text x="948.8" y="436.0" text-anchor="middle" class="mono ax">96,719 logs</text><text x="948.8" y="567.0" text-anchor="middle" class="mono ax">100</text><text x="948.8" y="585.0" text-anchor="middle" class="mono ax" fill="#9a9089">100 incidents</text>
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#16131019"/>
  <text x="64" y="690" class="mono foot">single laptop &#183; docker desktop &#183; 512MB/svc &#183; redpanda 1-node &#183; clickhouse 24.3 &#183; k6 50 VUs</text>
  
