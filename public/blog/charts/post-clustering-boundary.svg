  </g>
  <text x="1173" y="696" text-anchor="start" class="mono" font-size="18" font-weight="500" fill="#161310">log0</text>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/></svg>