    </style>
  </defs>
  <rect width="1280" height="720" fill="#f4f1ea"/>
  <text x="64" y="80" class="title">A burst that straddles a window boundary never pages</text>
  <text x="64" y="108" class="mono sub">one burst of 10 identical errors, split across two adjacent 5-min tumbling windows by event time - per-bucket count vs the threshold</text><rect x="96" y="168" width="1088" height="432" rx="10" fill="#ffffff" fill-opacity="0.20" stroke="#16131019"/><line x1="842" y1="131" x2="864" y2="131" stroke="#0BA06B" stroke-width="2.6" /><text x="870" y="135" class="mono leg">paged (8/8 trials)</text><line x1="1009" y1="131" x2="1031" y2="131" stroke="#a684ff" stroke-width="2.6" /><text x="1037" y="135" class="mono leg">missed (0/8 trials)</text><line x1="150" y1="568" x2="1130" y2="568" stroke="#16131019"/><text x="138" y="572.0" text-anchor="end" class="mono ax">0</text><line x1="150" y1="506" x2="1130" y2="506" stroke="#16131019"/><text x="138" y="510.0" text-anchor="end" class="mono ax">2</text><line x1="150" y1="444" x2="1130" y2="444" stroke="#16131019"/><text x="138" y="448.0" text-anchor="end" class="mono ax">4</text><line x1="150" y1="382" x2="1130" y2="382" stroke="#16131019"/><text x="138" y="386.0" text-anchor="end" class="mono ax">6</text><line x1="150" y1="320" x2="1130" y2="320" stroke="#16131019"/><text x="138" y="324.0" text-anchor="end" class="mono ax">8</text><line x1="150" y1="258" x2="1130" y2="258" stroke="#16131019"/><text x="138" y="262.0" text-anchor="end" class="mono ax">10</text><line x1="150" y1="196" x2="1130" y2="196" stroke="#16131019"/><text x="138" y="200.0" text-anchor="end" class="mono ax">12</text><line x1="150" y1="258" x2="1130" y2="258" stroke="#fb2c36" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="199.7" y="258.0" width="64" height="310.0" rx="3" fill="#0BA06B" fill-opacity="0.85"/><text x="231.7" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">10</text><text x="231.7" y="594.0" text-anchor="middle" class="mono ax">10 : 0</text><text x="231.7" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#0BA06B">incident</text><rect x="363.0" y="289.0" width="64" height="279.0" rx="3" fill="#a684ff" fill-opacity="0.85"/><rect x="363.0" y="258.0" width="64" height="31.0" rx="3" fill="#a684ff" fill-opacity="0.30"/><text x="395.0" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">9 + 1</text><text x="395.0" y="594.0" text-anchor="middle" class="mono ax">9 : 1</text><text x="395.0" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">no incident</text><rect x="526.3" y="320.0" width="64" height="248.0" rx="3" fill="#a684ff" fill-opacity="0.85"/><rect x="526.3" y="258.0" width="64" height="62.0" rx="3" fill="#a684ff" fill-opacity="0.30"/><text x="558.3" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">8 + 2</text><text x="558.3" y="594.0" text-anchor="middle" class="mono ax">8 : 2</text><text x="558.3" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">no incident</text><rect x="689.7" y="351.0" width="64" height="217.0" rx="3" fill="#a684ff" fill-opacity="0.85"/><rect x="689.7" y="258.0" width="64" height="93.0" rx="3" fill="#a684ff" fill-opacity="0.30"/><text x="721.7" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">7 + 3</text><text x="721.7" y="594.0" text-anchor="middle" class="mono ax">7 : 3</text><text x="721.7" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">no incident</text><rect x="853.0" y="382.0" width="64" height="186.0" rx="3" fill="#a684ff" fill-opacity="0.85"/><rect x="853.0" y="258.0" width="64" height="124.0" rx="3" fill="#a684ff" fill-opacity="0.30"/><text x="885.0" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">6 + 4</text><text x="885.0" y="594.0" text-anchor="middle" class="mono ax">6 : 4</text><text x="885.0" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">no incident</text><rect x="1016.3" y="413.0" width="64" height="155.0" rx="3" fill="#a684ff" fill-opacity="0.85"/><rect x="1016.3" y="258.0" width="64" height="155.0" rx="3" fill="#a684ff" fill-opacity="0.30"/><text x="1048.3" y="246.0" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#161310">5 + 5</text><text x="1048.3" y="594.0" text-anchor="middle" class="mono ax">5 : 5</text><text x="1048.3" y="614.0" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#a684ff">no incident</text><text x="158" y="278" class="mono" font-size="12" font-weight="600" fill="#fb2c36">occurrence-threshold = 10 - a single bucket must reach this to page</text><text x="34" y="382.0" transform="rotate(-90 34 382.0)" text-anchor="middle" class="axtitle">occurrences counted per 5-min bucket</text>
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#16131019"/>
  <text x="64" y="682" class="mono foot">clustering-service &#183; 5-min tumbling window keyed on event time &#183; 8 trials/ratio, distinct fingerprint each</text>
  <text x="64" y="698" class="mono foot">single laptop &#183; docker desktop &#183; 512MB/svc &#183; redpanda 1-node &#183; clickhouse 24.3 &#183; k6</text>
  
