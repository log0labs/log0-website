      .leg{font-weight:400;font-size:13px;fill:#161310}
      .axtitle{font-weight:500;font-size:12px;fill:#9a9089}
      .foot{font-weight:400;font-size:12px;fill:#a89e95}
      .val{font-weight:600;font-size:26px;fill:#161310}
